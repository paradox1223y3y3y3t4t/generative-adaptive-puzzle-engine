{% extends "base.html" %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="question-box">

        <!-- Puzzle Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <span class="text-muted">Category</span>
                <br>
                <span class="badge bg-secondary">
                    {{ puzzle["category"] }}
                </span>
            </div>

            <div class="text-center">
                <span class="text-muted">Difficulty</span>
                <br>
                <span class="badge bg-primary">
                    {{ puzzle["difficulty"] }}
                </span>
            </div>

            <div class="text-end">
                <span class="text-muted">Time</span>
                <br>
                <span class="timer text-danger">
                    ⏱ <span id="timer">0</span> seconds
                </span>
            </div>

        </div>

        <hr>

        <!-- Question -->
        <div class="mt-4 mb-4">

            <h5 class="text-muted">
                Solve the following puzzle:
            </h5>

            <h3 class="mt-3">
                {{ puzzle["question"] }}
            </h3>

        </div>

        <!-- Answer Form -->
        <form
            method="POST"
            action="{{ url_for('submit_answer') }}"
            id="puzzle-form"
        >

            <input
                type="hidden"
                name="response_time"
                id="response-time"
                value="0"
            >

            <!-- Options -->
            <div class="mt-4">

                {% for option in puzzle["options"] %}

                    <div class="form-check border rounded p-3 mb-3 option-btn">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="selected_answer"
                            value="{{ option }}"
                            id="option{{ loop.index }}"
                            required
                        >

                        <label
                            class="form-check-label w-100"
                            for="option{{ loop.index }}"
                        >
                            <strong>{{ loop.index }}.</strong>
                            {{ option }}
                        </label>

                    </div>

                {% endfor %}

            </div>

            <!-- Submit Button -->
            <div class="text-center mt-4">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Submit Answer
                </button>

            </div>

        </form>

        <!-- Cancel Button -->
        <div class="text-center mt-3">

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </div>

</div>

{% endblock %}
